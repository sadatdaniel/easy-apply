<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#eceef1" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Apply</title>
<style>
  /* shown until the app starts (it replaces #root's content); plain CSS, so it appears before any script */
  html, body { margin:0; height:100%; background:#f4f5f7; }
  .boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:#6b7280; }
  .boot b { font-size:28px; letter-spacing:-0.02em; color:#15171c; font-weight:700; }
  .boot b span { color:#2f9e6b; }
  .boot i { display:block; width:180px; height:3px; border-radius:3px; background:#e2e5ea; overflow:hidden; position:relative; }
  .boot i::after { content:""; position:absolute; inset:0; width:40%; border-radius:3px; background:#2f9e6b; animation:boot 1.1s ease-in-out infinite; }
  @keyframes boot { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .boot i::after { animation:none; width:100%; opacity:.5; } }
</style>
</head>
<body>
<div id="root"><div class="boot" role="status"><b>easy<span>·</span>apply</b><i></i><span>Loading…</span><noscript>Easy Apply needs JavaScript turned on.</noscript></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
